<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprova PCBA — planejamento, execução e reprogramação de estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --night:#0C1120; --panel:#121A2B; --panel2:#18233A; --raise:#1E2B45;
  --line:#263455; --line-soft:#1D2942;
  --ink:#E9EEF9; --muted:#8493B0; --faint:#5C6A88;
  --cyan:#57C7D8; --cyan-dim:#2C5A66;
  --sun:#EBA53C; --sun-dim:#5A4620;
  --mint:#5BC48E; --mint-dim:#254a38;
  --ember:#EE6B4D; --ember-dim:#4d2a22;
  --violet:#9B8CE0; --violet-dim:#332e57;
  --shadow:0 18px 40px -22px rgba(0,0,0,.75);
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 520px at 82% -8%, rgba(235,165,60,.10), transparent 60%),
    radial-gradient(900px 480px at 8% 0%, rgba(87,199,216,.07), transparent 55%),
    var(--night);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
a{color:var(--cyan);text-decoration:none}
::selection{background:rgba(87,199,216,.28)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{
  border-right:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(18,26,43,.7),rgba(12,17,32,.4));
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .glyph{width:34px;height:34px;border-radius:9px;position:relative;flex:none;
  background:linear-gradient(160deg,#182338,#0f1626);border:1px solid var(--line);overflow:hidden}
.brand .glyph::before{content:"";position:absolute;left:5px;right:5px;bottom:8px;height:1.5px;background:var(--line);opacity:.9}
.brand .glyph::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;left:11px;bottom:11px;
  background:radial-gradient(circle at 40% 35%,#ffd27a,var(--sun));box-shadow:0 0 14px 2px rgba(235,165,60,.55)}
.brand b{font-family:'Space Grotesk';font-size:16px;letter-spacing:-.02em;display:block;line-height:1.05}
.brand small{color:var(--faint);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:0;color:var(--muted);padding:9px 11px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;transition:background .12s,color .12s;position:relative;
}
.nav button .ic{width:17px;flex:none;opacity:.85;display:flex}
.nav button:hover{background:var(--panel);color:var(--ink)}
.nav button.on{background:var(--panel2);color:var(--ink)}
.nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan)}
.nav .badge{margin-left:auto;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--ember-dim);color:var(--ember)}
.nav .sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:16px 11px 6px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(12,17,32,.92),rgba(12,17,32,.72));
}
.topbar .vt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.topbar h2{font-size:17px}
.spacer{flex:1}
.selcon{display:flex;align-items:center;gap:8px}
select,input,textarea{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 10px;font-family:inherit;font-size:13px;
}
select:focus,input:focus,textarea:focus{border-color:var(--cyan)}
.chip-prova{display:flex;align-items:center;gap:9px;padding:6px 13px;border:1px solid var(--line);
  border-radius:30px;background:linear-gradient(180deg,rgba(235,165,60,.10),rgba(235,165,60,.02))}
.chip-prova .n{font-family:'Space Grotesk';font-size:19px;font-weight:700;color:var(--sun);line-height:1}
.chip-prova .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.content{padding:24px 26px 90px;max-width:1220px;width:100%}

/* ---------- Reusable ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;
  font-family:'JetBrains Mono';letter-spacing:.02em}
.tag.max{background:var(--ember-dim);color:#ffb59f}
.tag.alta{background:var(--sun-dim);color:#f7c877}
.tag.media{background:var(--cyan-dim);color:#a9e6ef}
.tag.baixa{background:#232f49;color:var(--muted)}
.tag.fora{background:#241d24;color:#b78ab0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--cyan);background:var(--raise)}
.btn.primary{background:linear-gradient(180deg,#5fd0e0,#37a6b6);color:#062026;border:0}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sun{background:linear-gradient(180deg,#f2b45a,#d98d29);color:#2a1c05;border:0}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.divider{height:1px;background:var(--line-soft);margin:14px 0}
.pill-metric{background:var(--panel2);border:1px solid var(--line-soft);border-radius:12px;padding:13px 15px}
.pill-metric .v{font-family:'Space Grotesk';font-size:24px;font-weight:700;line-height:1}
.pill-metric .k{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}

/* status select as inline control */
.stsel{font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;border-radius:7px;padding:4px 8px;border:1px solid var(--line)}
.st-nao{color:var(--faint)}
.st-and{color:var(--cyan);border-color:var(--cyan-dim)}
.st-con{color:var(--mint);border-color:var(--mint-dim)}
.st-adi{color:var(--violet);border-color:var(--violet-dim)}
.st-dis{color:var(--faint);text-decoration:line-through}

/* Horizon signature */
.horizon{position:relative;height:132px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-soft);
  background:linear-gradient(180deg,#0a0f1d 0%,#0e1526 40%,#17253c 72%,#243a54 100%)}
.horizon .stars{position:absolute;inset:0;opacity:.5}
.horizon .glow{position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(180deg,transparent, rgba(235,165,60,.16) 70%, rgba(235,165,60,.30))}
.horizon .line{position:absolute;left:0;right:0;bottom:26px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.horizon .track{position:absolute;left:22px;right:22px;bottom:26px;height:2px;background:rgba(255,255,255,.08);border-radius:2px}
.horizon .fill{position:absolute;left:22px;bottom:26px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--sun));border-radius:2px}
.horizon .sun{position:absolute;bottom:20px;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffe6a8,var(--sun));box-shadow:0 0 20px 5px rgba(235,165,60,.6);transform:translateX(-50%)}
.horizon .cap{position:absolute;bottom:6px;font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono'}
.horizon .capL{left:22px}.horizon .capR{right:22px;text-align:right}
.horizon .lead{position:absolute;top:14px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}
.horizon .lead .big{font-family:'Space Grotesk';font-size:30px;font-weight:700;line-height:.9}
.horizon .lead .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* task block */
.blk{display:flex;gap:14px;padding:14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--panel2);align-items:flex-start}
.blk.done{opacity:.62}
.blk .slot{flex:none;width:70px;text-align:center;padding-top:2px}
.blk .slot .lt{font-family:'Space Grotesk';font-size:19px;font-weight:700}
.blk .slot .tm{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);margin-top:2px}
.blk .slot .mn{font-size:10px;color:var(--faint)}
.blk .body{flex:1;min-width:0}
.blk .body .cad{font-weight:600;font-size:14.5px}
.blk .body .meta{font-size:12px;color:var(--muted);margin-top:2px}
.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.code{font-family:'JetBrains Mono';font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line-soft);color:var(--muted)}
.code.done{color:var(--mint);border-color:var(--mint-dim)}
.blk .act{flex:none;display:flex;flex-direction:column;gap:7px;align-items:flex-end}

/* review item */
.rev{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line-soft);border-radius:10px;background:var(--panel2)}
.rev .rtype{font-family:'JetBrains Mono';font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.rev.venc{border-color:var(--ember-dim);background:linear-gradient(90deg,rgba(238,107,77,.06),var(--panel2))}

/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.015)}
.bar{height:6px;border-radius:6px;background:var(--panel);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px}

/* gauge */
.gauge{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;flex:none;
  background:conic-gradient(var(--gc,var(--mint)) calc(var(--p)*1%), var(--panel2) 0);
  display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-family:'Space Grotesk';font-size:26px}
.ring small{position:relative;display:block;text-align:center;color:var(--muted);font-size:10px;margin-top:-2px}

/* scenarios */
.scn{border:1px solid var(--line-soft);border-radius:12px;padding:15px;background:var(--panel2)}
.scn h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,9,16,.72);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:18px}
.overlay.on{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field textarea,.field select{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 18px;font-size:13px;
  box-shadow:var(--shadow);z-index:80;transition:.22s;pointer-events:none;display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* mobile nav */
.mnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .content{padding:18px 14px 96px}
  .topbar{padding:12px 14px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(12,17,32,.96);
    border-top:1px solid var(--line);overflow-x:auto;backdrop-filter:blur(10px)}
  .mnav button{flex:1;min-width:66px;background:transparent;border:0;color:var(--muted);padding:9px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;position:relative}
  .mnav button.on{color:var(--cyan)}
  .mnav button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--cyan);border-radius:2px}
  .f2{grid-template-columns:1fr}
  .blk{flex-wrap:wrap}
  .blk .act{width:100%;flex-direction:row;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="glyph"></div><div><b>Aprova PCBA</b><small>estudo · revisão · reprogramação</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><div class="vt" id="viewEyebrow">Painel</div><h2 id="viewTitle">Hoje</h2></div>
      <div class="spacer"></div>
      <div class="selcon">
        <select id="concursoSel" title="Concurso ativo"></select>
      </div>
      <div class="chip-prova" title="Dias até a prova">
        <div><div class="n mono" id="diasProva">—</div></div>
        <div class="l">dias<br>até a prova</div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<nav class="mnav" id="mnav"></nav>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

function buildDicaMap(){DICAMAP={};DS.dicas.forEach(d=>DICAMAP[d.c]=d);}

async function loadConcursos(){
  const saved=await store.get('pcba:concursos');
  CONCURSOS=[EMBED];
  if(saved&&Array.isArray(saved.list)){
    for(const c of saved.list){
      if(c.id===EMBED.id)continue;
      const ds=await store.get('pcba:data:'+c.id);
      CONCURSOS.push({id:c.id,nome:c.nome,data:ds||emptyDataset()});
    }
  }
  ACTIVE=(saved&&saved.active&&CONCURSOS.find(c=>c.id===saved.active))?saved.active:EMBED.id;
}
async function saveConcursos(){
  await store.set('pcba:concursos',{active:ACTIVE,list:CONCURSOS.map(c=>({id:c.id,nome:c.nome}))});
}

async function loadState(){
  DS=CONCURSOS.find(c=>c.id===ACTIVE).data;

  const raw=await store.get('pcba:state:'+ACTIVE);

// A1. Algoritmo SM-2 Adaptativo
function applySM2(review, rating){
  review.easeFactor = review.easeFactor || 2.5;
  review.repetitions = (review.repetitions || 0) + 1;
  let ef = review.easeFactor + (0.1 - (5 - rating) * (0.08 + (5 - rating) * 0.02));
  if (ef < 1.3) ef = 1.3;
  review.easeFactor = ef;
  let interval = 1;
  if (rating < 3) {
    review.repetitions = 0;
    interval = 1;
  } else {
    if (review.repetitions === 1) interval = 1;
    else if (review.repetitions === 2) interval = 6;
    else interval = Math.round((review.interval || 6) * ef);
  }
  review.interval = interval;
  return nextAvailableDate(addDays(review.real || TODAY(), interval));
}

// A2. Priorização Dinâmica por ROI (Retorno por Minuto)
function calculateROIScore(task){
  const prioW = { 'MÁXIMA. AOCP': 4, 'ALTA': 3, 'MÉDIA': 2, 'BAIXA': 1 }[task.prio] || 1;
  const aprov = task.aprov !== null ? task.aprov : 0;
  const dom = task.dom !== null ? task.dom : 1;
  const gap = (100 - aprov) * (6 - dom);
  return (prioW * gap) / Math.max(1, task.min);
}

// A3. Detecção de Gargalos
function detectBottlenecks(){
  const bottlenecks = [];
  DS.plano.forEach((b, i) => {
    const t = planTask(i);
    if (!DONE(t.status) && ((t.u.postponedCount || 0) >= 3 || (t.aprov !== null && t.aprov < 60))) {
      bottlenecks.push(t);
    }
  });
  return bottlenecks;
}

// B1. Pomodoro Timer
let pomodoroTimer = null;
let pomodoroSeconds = 0;
let pomodoroActiveId = null;

function startPomodoro(id, minutes){
  if (pomodoroTimer) clearInterval(pomodoroTimer);
  pomodoroActiveId = id;
  pomodoroSeconds = minutes * 60;
  pomodoroTimer = setInterval(() => {
    pomodoroSeconds--;
    updatePomodoroDisplay();
    if (pomodoroSeconds <= 0) {
      clearInterval(pomodoroTimer);
      pomodoroTimer = null;
      playBeepSound();
      toast('⏰ Pomodoro concluído! Registre o bloco.');
      modalReg(id);
    }
  }, 1000);
  toast(`⏱️ Pomodoro de ${minutes}min iniciado!`);
  render();
}

function pausePomodoro(){
  if (pomodoroTimer) { clearInterval(pomodoroTimer); pomodoroTimer = null; toast('⏸️ Pomodoro pausado'); render(); }
}

function updatePomodoroDisplay(){
  const el = document.getElementById('pomoDisplay');
  if (el) {
    const m = String(Math.floor(pomodoroSeconds / 60)).padStart(2, '0');
    const s = String(pomodoroSeconds % 60).padStart(2, '0');
    el.textContent = `${m}:${s}`;
  }
}

function playBeepSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = 587.33;
    osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

// C1. Projeção de Nota na Prova
function calculateProjectedScore(){
  const perf = performance();
  const discWeights = { 'Língua Portuguesa': 15, 'Raciocínio Lógico': 10, 'Noções de Direito Penal': 20, 'Noções de Direito Processual Penal': 15, 'Noções de Direito Constitucional': 10, 'Noções de Direito Administrativo': 10 };
  let totalScore = 0; let maxScore = 0;
  for (const disc in discWeights) {
    const w = discWeights[disc];
    const items = perf.filter(p => p.disc === disc);
    const valid = items.filter(p => p.ap !== null);
    const avgAprov = valid.length ? (valid.reduce((a, b) => a + b.ap, 0) / valid.length) : 70;
    totalScore += (avgAprov / 100) * w;
    maxScore += w;
  }
  return { score: Math.round(totalScore * 10) / 10, max: maxScore };
}

  {id:'caca',t:'Caça-Questões',eye:'Filtro inteligente AOCP',ic:IC.caca},

];
let ROUTE='hoje';

function tagP(p){const m={'MÁXIMA. AOCP':'max','ALTA':'alta','MÉDIA':'media','BAIXA':'baixa'};
  return `<span class="tag ${m[p]||'baixa'}">${esc(p)}</span>`;}
function statusSelect(id,st){
  const opts=['Não iniciado','Em andamento','Concluído','Adiado','Dispensado'];
  const cls={'Não iniciado':'st-nao','Em andamento':'st-and','Concluído':'st-con','Adiado':'st-adi','Dispensado':'st-dis'}[st];
  return `<select class="stsel ${cls}" data-task="${id}" data-change="status">`+
    opts.map(o=>`<option ${o===st?'selected':''}>${o}</option>`).join('')+`</select>`;
}

function renderNav(){
  const venc=stats().revVenc;
  const html=v=>`<button class="${ROUTE===v.id?'on':''}" data-route="${v.id}">${svg(v.ic)}<span>${v.t}</span>${v.id==='rev'&&venc?`<span class="badge">${venc}</span>`:''}</button>`;
  $('#nav').innerHTML=`<div class="sec">Rotina</div>`+VIEWS.slice(0,6).map(html).join('')+
    `<div class="sec">Sistema</div>`+VIEWS.slice(6).map(html).join('');
  const mv=[VIEWS[0],VIEWS[1],VIEWS[2],VIEWS[3],VIEWS[6],VIEWS[7]];
  $('#mnav').innerHTML=mv.map(v=>`<button class="${ROUTE===v.id?'on':''}" data-route="${v.id}">${svg(v.ic)}<span>${v.t.split(' ')[0]}</span></button>`).join('');
}

/* ---------- HOJE ---------- */
function viewHoje(){
  const ref=TODAY();const st=stats();
  const start=DS.plano.length?DS.plano[0].d:ref;
  const prova=S.config.provaDate;
  const total=Math.max(1,diffDays(start,prova));
  const elapsed=clamp(diffDays(start,ref),0,total);
  const sunPct=clamp(st.pct,0,100); // sol pela conclusão de conteúdo
  const dias=diffDays(ref,prova);

  // blocos de hoje (plano)
  const hoje=[];DS.plano.forEach((b,i)=>{const t=planTask(i);if(t.date===ref)hoje.push(t);});
  hoje.sort((a,b)=>({A:0,B:1,C:2}[a.bl]-{A:0,B:1,C:2}[b.bl]));
  // revisões de hoje / vencidas
  const revsHoje=reviewsList().filter(r=>['Pendente','Adiada'].includes(r.status)&&(r.plannedDate===ref||r.prev===ref));
  const revsVenc=reviewsList().filter(r=>revVenc(r,ref));
  // pendências (blocos incompletos anteriores a hoje)
  const pend=[];DS.plano.forEach((b,i)=>{const t=planTask(i);if(!DONE(t.status)&&t.date<ref)pend.push(t);});
  // desempenho abaixo da meta
  const below=belowTarget().slice(0,6);
  // viabilidade
  const rp=reprogram(ref,false);
  const prov=rp.scenarios[1];

  const sat=isWeekend(ref);
  const q=(n,body)=>`<div class="card"><div class="eyebrow">${n}</div><div style="margin-top:12px">${body}</div></div>`;

  const blkHtml=t=>{
    const bl=S.config.blocos.find(x=>x.id===t.bl)||{ini:t.ini,fim:t.fim};
    const codes=blockDicas(t);
    return `<div class="blk ${DONE(t.status)?'done':''}">
      <div class="slot"><div class="lt">${t.bl}</div><div class="tm mono">${bl.ini}</div><div class="mn mono">${t.min}min</div></div>
      <div class="body">
        <div class="row" style="gap:8px;flex-wrap:wrap"><span class="cad">${esc(t.cad)}</span>${tagP(t.prio)}</div>
        <div class="meta">${esc(t.disc)} · ${esc(t.it)}</div>
        <div class="codes">${codes.map(c=>`<span class="code ${S.dicas[c]?.status==='Concluído'?'done':''}" title="${esc(DICAMAP[c]?.t||'')}">${c}</span>`).join('')}</div>
      </div>
      <div class="act">${statusSelect(t.id,t.status)}<button class="btn sm ghost" data-open="reg" data-id="${t.id}">Registrar</button></div>
    </div>`;
  };
  const revHtml=r=>{const p=tget(r.parent);const v=revVenc(r,ref);
    return `<div class="rev ${v?'venc':''}">
      <span class="rtype mono" style="color:${v?'var(--ember)':'var(--cyan)'}">${r.tipo.replace('D','D+')}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(p.cad)}</div>
      <div class="faint" style="font-size:11.5px">prevista ${fmtShort(r.prev)}${v?' · vencida':''} · ${r.dur}min</div></div>
      <button class="btn sm" data-open="revform" data-id="${r.id}">Revisar</button></div>`;};

  return `
  <div class="grid" style="grid-template-columns:1fr;gap:18px">
    <div class="horizon">
      <div class="lead">
        <div><div class="big mono">${dias<0?'—':dias}</div><div class="lbl">dias até a prova · ${fmtBR(prova)}</div></div>
        <div style="text-align:right"><div class="big mono" style="color:var(--mint)">${st.pct}%</div><div class="lbl">conteúdo concluído</div></div>
      </div>
      <div class="glow"></div><div class="line"></div>
      <div class="track"></div><div class="fill" style="width:calc(${sunPct}% - 0px)"></div>
      <div class="sun" style="left:calc(22px + (100% - 44px)*${sunPct/100})"></div>
      <div class="cap capL mono">${fmtShort(start)} início</div><div class="cap capR mono">prova ${fmtShort(prova)}</div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="pill-metric"><div class="v mono">${st.done}/${st.tot}</div><div class="k">blocos concluídos</div></div>
      <div class="pill-metric"><div class="v mono" style="color:${st.aprov!==null&&st.aprov<80?'var(--ember)':'var(--mint)'}">${st.aprov===null?'—':st.aprov+'%'}</div><div class="k">aproveitamento em questões</div></div>
      <div class="pill-metric"><div class="v mono" style="color:${st.revVenc?'var(--ember)':'var(--ink)'}">${st.revVenc}</div><div class="k">revisões vencidas</div></div>
      <div class="pill-metric"><div class="v mono" style="color:var(--sun)">${prov.pct>=100?'≥100':prov.pct}%</div><div class="k">viabilidade (provável)</div></div>
    </div>

    <div class="grid" style="grid-template-columns:1.35fr 1fr">
      ${q(sat?'1 · Hoje é '+WD[dow(ref)]+' — rotina de fim de semana':'1 · O que estudar hoje ('+WD[dow(ref)]+' '+fmtShort(ref)+')',
        sat?`<div class="muted">Sábados e domingos têm finalidade fixa. Veja a aba <a data-route="fds">Sábados &amp; Domingos</a>.</div>`
        :(hoje.length?hoje.map(blkHtml).join('<div style="height:10px"></div>')
          :`<div class="muted">Sem blocos de conteúdo para hoje. ${dias<0?'A prova já passou nesta configuração.':'Rode <a data-route="reprog">Reprogramar</a> para preencher o dia.'}</div>`))}

      <div class="grid" style="grid-template-columns:1fr;gap:16px">
        ${q('2 · Revisões vencidas ou previstas',
          (revsVenc.length||revsHoje.length)
          ?[...revsVenc,...revsHoje.filter(r=>!revsVenc.includes(r))].slice(0,6).map(revHtml).join('<div style="height:8px"></div>')
            +(revsVenc.length>6||revsHoje.length>6?`<div style="margin-top:8px"><a data-route="rev">ver todas</a></div>`:'')
          :`<div class="muted">Nenhuma revisão vencida ou prevista para hoje.</div>`)}
        ${q('5 · Impacto do progresso',
          `<div class="row" style="justify-content:space-between"><span class="muted">Concluir todo o conteúdo antes da prova</span></div>
           <div style="height:8px"></div>
           <div class="row" style="gap:12px">
             <div class="ring" style="--p:${clamp(prov.pct,0,100)};--gc:${prov.pct>=100?'var(--mint)':prov.pct>=70?'var(--sun)':'var(--ember)'}"><b class="mono">${prov.pct>=100?'✓':prov.pct+'%'}</b><small>provável</small></div>
             <div style="font-size:12px" class="muted">Exige <b class="mono" style="color:var(--ink)">${Math.round(rp.required/60)}h</b> · disponível <b class="mono" style="color:var(--ink)">${Math.round(prov.avail/60)}h</b><br>
             ${rp.overflow.length?`<span style="color:var(--ember)">${rp.overflow.length} tarefas sem encaixe</span>`:'<span style="color:var(--mint)">cabe no calendário</span>'}<br>
             <a data-route="reprog">ver cenários</a></div>
           </div>`)}
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr">
      ${q('3 · Pendências e redistribuição',
        pend.length?`<div class="muted" style="margin-bottom:10px">${pend.length} bloco(s) anteriores sem conclusão. O motor redistribui sem passar de ${S.config.capDia} min/dia útil.</div>
          <div style="max-height:220px;overflow:auto">${pend.slice(0,10).map(t=>`<div class="rev" style="margin-bottom:7px"><span class="rtype mono">${fmtShort(t.date)}</span><div style="flex:1"><b>${esc(t.cad)}</b> <span class="faint">${t.bl} · ${t.min}min</span></div>${tagP(t.prio)}</div>`).join('')}</div>
          <button class="btn sun sm" data-act="reprog-run" style="margin-top:12px">Reprogramar pendências</button>`
        :`<div class="muted">Sem pendências acumuladas. 🎯</div>`)}
      ${q('4 · Desempenho abaixo da meta ('+S.config.metaAprov+'%)',
        below.length?`<table><thead><tr><th>Item do edital</th><th>Aprov.</th><th>Domínio</th></tr></thead><tbody>${below.map(r=>`<tr><td>${esc(r.disc)}<div class="faint" style="font-size:11px">${esc(r.it)}</div></td><td class="mono" style="color:${r.ap<80?'var(--ember)':'var(--ink)'}">${r.ap===null?'—':r.ap+'%'}</td><td class="mono">${r.dm?r.dm.toFixed(1):'—'}</td></tr>`).join('')}</tbody></table>`
        :`<div class="muted">Nenhum item abaixo da meta registrado ainda.</div>`)}
    </div>
  </div>`;
}

/* ---------- CRONOGRAMA ---------- */
let cronoFilter={disc:'',prio:'',status:'',fase:''};
function viewCrono(){
  const discs=[...new Set(DS.plano.map(b=>b.disc))].sort();
  const fases=[...new Set(DS.plano.map(b=>b.fase))];
  const tasks=DS.plano.map((b,i)=>planTask(i)).filter(t=>{
    if(cronoFilter.disc&&t.disc!==cronoFilter.disc)return false;
    if(cronoFilter.prio&&t.prio!==cronoFilter.prio)return false;
    if(cronoFilter.status&&t.status!==cronoFilter.status)return false;
    if(cronoFilter.fase&&t.fase!==cronoFilter.fase)return false;
    return true;});
  // agrupa por data
  const byDate={};tasks.forEach(t=>{(byDate[t.date]=byDate[t.date]||[]).push(t);});
  const dates=Object.keys(byDate).sort();
  const ref=TODAY();
  const opt=(arr,cur)=>arr.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
  let html=`<div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:10px">
    <select data-filter="disc"><option value="">Todas as disciplinas</option>${opt(discs,cronoFilter.disc)}</select>
    <select data-filter="prio"><option value="">Toda prioridade</option>${opt(['MÁXIMA. AOCP','ALTA','MÉDIA','BAIXA'],cronoFilter.prio)}</select>
    <select data-filter="status"><option value="">Todo status</option>${opt(['Não iniciado','Em andamento','Concluído','Adiado','Dispensado'],cronoFilter.status)}</select>
    <select data-filter="fase"><option value="">Toda fase</option>${opt(fases,cronoFilter.fase)}</select>
    <div class="spacer"></div><span class="muted mono">${tasks.length} blocos</span>
  </div></div>`;
  html+=`<div class="grid" style="grid-template-columns:1fr;gap:14px">`;
  for(const d of dates){
    const arr=byDate[d].sort((a,b)=>({A:0,B:1,C:2}[a.bl]-{A:0,B:1,C:2}[b.bl]));
    const load=arr.reduce((a,b)=>a+b.min,0);
    const isToday=d===ref;
    html+=`<div class="card" style="${isToday?'border-color:var(--cyan)':''}">
      <div class="row" style="margin-bottom:12px">
        <div><span class="eyebrow">${WD[dow(d)]}</span> <b class="mono" style="font-size:15px;margin-left:6px">${fmtBR(d)}</b> ${isToday?'<span class="tag media">hoje</span>':''}</div>
        <div class="spacer"></div>
        <span class="muted mono" style="color:${load>S.config.capDia?'var(--ember)':'var(--muted)'}">${load}/${S.config.capDia} min</span>
      </div>
      ${arr.map(t=>{const bl=S.config.blocos.find(x=>x.id===t.bl)||{ini:t.ini};const codes=blockDicas(t);
        return `<div class="blk ${DONE(t.status)?'done':''}" style="margin-bottom:9px">
          <div class="slot"><div class="lt">${t.bl}</div><div class="tm mono">${bl.ini}</div><div class="mn mono">${t.min}min</div></div>
          <div class="body"><div class="row" style="gap:8px;flex-wrap:wrap"><span class="cad">${esc(t.cad)}</span>${tagP(t.prio)}<span class="faint" style="font-size:11px">${esc(t.fase)}</span></div>
          <div class="meta">${esc(t.it)}</div>
          <div class="codes">${codes.map(c=>`<span class="code ${S.dicas[c]?.status==='Concluído'?'done':''}" title="${esc(DICAMAP[c]?.t||'')}">${c}</span>`).join('')}</div></div>
          <div class="act">${statusSelect(t.id,t.status)}<button class="btn sm ghost" data-open="reg" data-id="${t.id}">Registrar</button></div>
        </div>`;}).join('')}
    </div>`;
  }
  html+=`</div>`;
  if(!dates.length)html+=`<div class="card muted">Nenhum bloco com esses filtros.</div>`;
  return html;
}

/* ---------- REVISÕES ---------- */
function viewRev(){
  const ref=TODAY();const revs=reviewsList();
  if(!revs.length)return `<div class="card"><div class="eyebrow">Revisão espaçada</div><p class="muted" style="margin-top:10px">As revisões <b>D+1</b>, <b>D+7</b> e <b>D+30</b> são criadas automaticamente quando você conclui o 1º estudo de um bloco. Marque um bloco como <b>Concluído</b> na aba Hoje ou Cronograma para começar.</p></div>`;
  const venc=revs.filter(r=>revVenc(r,ref));
  const prev=revs.filter(r=>['Pendente','Adiada'].includes(r.status)&&r.prev>=ref).sort((a,b)=>a.prev<b.prev?-1:1);
  const feitas=revs.filter(r=>['Concluída no prazo','Concluída com atraso','Dispensada'].includes(r.status));
  const card=(r)=>{const p=tget(r.parent);const v=revVenc(r,ref);
    const sc={'Pendente':'st-nao','Concluída no prazo':'st-con','Concluída com atraso':'st-adi','Adiada':'st-adi','Dispensada':'st-dis'}[r.status];
    return `<div class="rev ${v?'venc':''}" style="margin-bottom:8px">
      <span class="rtype mono" style="color:${v?'var(--ember)':r.status.startsWith('Concl')?'var(--mint)':'var(--cyan)'}">${r.tipo.replace('D','D+')}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(p.cad)} <span class="faint" style="font-weight:400;font-size:11px">${esc(p.disc)}</span></div>
      <div class="faint" style="font-size:11.5px">prev ${fmtShort(r.prev)}${r.real?' · feita '+fmtShort(r.real):''} · ${r.dur}min${r.questoes?` · ${r.acertos}/${r.questoes} q`:''}${r.domDepois?` · dom ${r.domDepois}`:''}</div></div>
      <span class="stsel ${sc}" style="cursor:default">${r.status}</span>
      <button class="btn sm" data-open="revform" data-id="${r.id}">Abrir</button></div>`;};
  const sec=(t,c,arr)=>`<div class="card" style="margin-bottom:16px"><div class="row"><div class="eyebrow" style="color:${c}">${t}</div><div class="spacer"></div><span class="mono muted">${arr.length}</span></div><div style="margin-top:12px">${arr.length?arr.map(card).join(''):'<div class="muted">—</div>'}</div></div>`;
  return sec('Vencidas','var(--ember)',venc)+sec('Previstas','var(--cyan)',prev.slice(0,40))+sec('Concluídas / dispensadas','var(--mint)',feitas.slice(0,40));
}

/* ---------- EDITAL ---------- */
let editalFilter='';
function viewEdital(){
  const perf=performance();
  const perfMap={};perf.forEach(r=>{perfMap[r.disc+'|'+(r.it.match(/(\d+)/)?.[1]||'')]= r;});
  const items=DS.cobertura.filter(c=>!editalFilter||c.disc===editalFilter||c.prio===editalFilter||c.sit===editalFilter);
  const discs=[...new Set(DS.cobertura.map(c=>c.disc))].sort();
  const sits=[...new Set(DS.cobertura.map(c=>c.sit))].filter(Boolean);
  const covByPrio={};DS.cobertura.forEach(c=>{covByPrio[c.prio]=(covByPrio[c.prio]||0)+1;});
  const lac=DS.cobertura.filter(c=>c.sit&&/sem dica|lacuna|parcial/i.test(c.sit)).length;
  let html=`<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    <div class="pill-metric"><div class="v mono">${DS.cobertura.length}</div><div class="k">itens do edital</div></div>
    <div class="pill-metric"><div class="v mono" style="color:var(--mint)">${DS.cobertura.filter(c=>/coberto diretamente/i.test(c.sit)).length}</div><div class="k">cobertos diretamente</div></div>
    <div class="pill-metric"><div class="v mono" style="color:var(--ember)">${lac}</div><div class="k">com lacuna / parcial</div></div>
    <div class="pill-metric"><div class="v mono" style="color:var(--sun)">${covByPrio['MÁXIMA. AOCP']||0}</div><div class="k">itens MÁXIMA (AOCP)</div></div>
  </div>`;
  html+=`<div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:10px">
    <select data-editalf><option value="">Todos os itens</option>
    <optgroup label="Disciplina">${discs.map(d=>`<option ${editalFilter===d?'selected':''}>${esc(d)}</option>`).join('')}</optgroup>
    <optgroup label="Prioridade">${['MÁXIMA. AOCP','ALTA','MÉDIA','BAIXA'].map(p=>`<option ${editalFilter===p?'selected':''}>${esc(p)}</option>`).join('')}</optgroup>
    <optgroup label="Situação">${sits.map(s=>`<option ${editalFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</optgroup></select>
    <div class="spacer"></div><span class="muted mono">${items.length} itens</span></div></div>`;
  html+=`<div class="card" style="padding:0;overflow:auto"><table><thead><tr>
    <th>Disciplina / item</th><th>Prioridade</th><th>Dicas</th><th>Situação</th><th>Aprov.</th><th>Ação / lacuna</th></tr></thead><tbody>`;
  for(const c of items){
    const pf=perfMap[c.disc+'|'+c.it];
    const ap=pf?pf.ap:null;
    html+=`<tr>
      <td><b>${esc(c.disc)}</b> <span class="faint mono">#${esc(c.it)}</span><div class="faint" style="font-size:11px;max-width:340px">${esc(c.cont)}</div></td>
      <td>${tagP(c.prio)}</td>
      <td class="mono"><span title="diretas">${c.dir}</span><span class="faint">·${c.parc}·${c.comp}·${c.corr}</span></td>
      <td><span style="font-size:12px;color:${/coberto direta/i.test(c.sit)?'var(--mint)':/sem dica|lacuna/i.test(c.sit)?'var(--ember)':'var(--muted)'}">${esc(c.sit)}</span></td>
      <td class="mono" style="color:${ap!==null&&ap<80?'var(--ember)':'var(--ink)'}">${ap===null?'—':ap+'%'}</td>
      <td class="faint" style="font-size:11.5px;max-width:210px">${esc(c.lac||'—')}</td></tr>`;
  }
  html+=`</tbody></table></div>`;
  return html;
}

/* ---------- DICAS ---------- */

  if(dicaQuery){const q=dicaQuery.toLowerCase();list=list.filter(d=>(d.t+' '+d.c+' '+d.disc).toLowerCase().includes(q));}

  html+=`<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Código</th><th>Título integral da dica</th><th>Item do edital</th><th>Prio · Aderência</th><th>Domínio</th><th>Status</th></tr></thead><tbody>`;
  for(const d of list){const u=S.dicas[d.c]||{};
    html+=`<tr>
      <td class="mono" style="color:var(--cyan)">${d.c}</td>
      <td style="max-width:420px"><b style="font-weight:500">${esc(d.t)}</b><div class="faint" style="font-size:11px">${esc(d.cad)} · p.${esc(d.pg)}</div></td>
      <td class="faint" style="font-size:11.5px">${esc(d.disc)} <span class="mono">#${esc(d.it)}</span></td>
      <td>${tagP(d.prio)}<div class="faint" style="font-size:11px">${esc(d.ad)}</div></td>
      <td><select class="stsel" data-dica="${d.c}" data-change="dom" style="padding:3px 6px">${[0,1,2,3,4,5].map(n=>`<option ${(u.dom||0)==n?'selected':''} value="${n}">${n||'—'}</option>`).join('')}</select></td>
      <td><select class="stsel ${sc[u.status]||'st-nao'}" data-dica="${d.c}" data-change="dicastatus">${['Não iniciado','Em andamento','Concluído','Adiado','Dispensado'].map(o=>`<option ${(u.status||'Não iniciado')===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`;}

/* ---------- FDS ---------- */
function viewFds(){
  if(!DS.fds.length)return `<div class="card muted">Sem plano de fins de semana neste concurso.</div>`;
  const byDate={};DS.fds.forEach((b,i)=>{const t=fdsTask(i);(byDate[t.d]=byDate[t.d]||[]).push(t);});
  const dates=Object.keys(byDate).sort();
  const ref=TODAY();
  let html=`<div class="card" style="margin-bottom:16px"><p class="muted" style="margin:0"><b style="color:var(--ink)">Sábado</b> — revisões, caderno de erros, treino discursivo, correção e reescrita.  <b style="color:var(--ink)">Domingo</b> — simulados, correção integral e exercícios direcionados. O motor não remaneja tarefas para estes dias (finalidade fixa).</p></div>`;
  html+=`<div class="grid" style="grid-template-columns:1fr;gap:14px">`;
  for(const d of dates.filter(x=>x>=ref).slice(0,10).concat(dates.filter(x=>x<ref).slice(-3)).sort()){
    const arr=byDate[d];const load=arr.reduce((a,b)=>a+b.min,0);
    html+=`<div class="card" style="${d===ref?'border-color:var(--cyan)':''}">
      <div class="row" style="margin-bottom:10px"><span class="eyebrow">${WD[dow(d)]}</span> <b class="mono" style="margin-left:6px">${fmtBR(d)}</b>${d===ref?' <span class="tag media">hoje</span>':''}<div class="spacer"></div><span class="muted mono">${load} min</span></div>
      ${arr.map(t=>`<div class="rev" style="margin-bottom:8px">
        <span class="rtype mono">${t.ini}</span>
        <div style="flex:1;min-width:0"><b>${esc(t.tipo)}</b> <span class="faint">${t.min}min</span><div class="faint" style="font-size:11.5px">${esc(t.foco)}${t.meta?' · meta '+t.meta+' questões':''}</div></div>
        ${statusSelect(t.id,t.status)}</div>`).join('')}
    </div>`;
  }
  html+=`</div>`;
  return html;
}

/* ---------- REPROGRAMAR ---------- */
function viewReprog(){
  const ref=TODAY();const rp=reprogram(ref,false);
  const inviavel=rp.overflow.length>0||rp.scenarios[1].pct<100;
  const scn=s=>`<div class="scn"><h4><span class="dot" style="background:${s.ok?'var(--mint)':'var(--ember)'}"></span>${s.nome} · ${s.capd} min/dia</h4>
    <div class="row" style="justify-content:space-between"><span class="muted">Viabilidade</span><b class="mono" style="font-size:20px;color:${s.ok?'var(--mint)':s.pct>=70?'var(--sun)':'var(--ember)'}">${s.pct>=100?'≥100':s.pct}%</b></div>
    <div class="bar" style="margin:8px 0"><i style="width:${clamp(s.pct,0,100)}%;background:${s.ok?'var(--mint)':s.pct>=70?'var(--sun)':'var(--ember)'}"></i></div>
    <div class="faint" style="font-size:11.5px">${Math.round(s.avail/60)}h disponíveis · ${s.folga>=0?'folga de '+Math.round(s.folga/60)+'h':'déficit de '+Math.round(-s.folga/60)+'h'}<br>${s.note}</div></div>`;
  const tierGroups={};rp.q.forEach(it=>{(tierGroups[it.tier]=tierGroups[it.tier]||[]).push(it);});
  let html=`<div class="card" style="margin-bottom:16px">
    <div class="row" style="flex-wrap:wrap;gap:14px">
      <div><div class="eyebrow">Motor de reprogramação</div><h3 style="margin-top:6px">Fila priorizada de estudos</h3></div>
      <div class="spacer"></div>
      <button class="btn sun" data-act="reprog-run">Aplicar reprogramação</button>
    </div>
    <p class="muted" style="margin-top:10px;font-size:12.5px">Reexecuta ao alterar status, indisponibilidade ou data da prova. Ordem fixa de prioridade, capacidade de <b class="mono">${S.config.capDia} min</b>/dia útil, fins de semana preservados. ${S.meta.lastReprogram?'Última aplicação: '+new Date(S.meta.lastReprogram).toLocaleString('pt-BR'):'Ainda não aplicada.'}</p>
  </div>`;

  if(inviavel)html+=`<div class="card" style="margin-bottom:16px;border-color:var(--ember-dim);background:linear-gradient(90deg,rgba(238,107,77,.06),var(--panel))">
    <div class="row"><span class="dot" style="background:var(--ember)"></span><b style="color:#ffb59f">Alerta de inviabilidade</b></div>
    <p class="muted" style="margin-top:8px">Exige <b class="mono" style="color:var(--ink)">${Math.round(rp.required/60)}h</b> em <b class="mono" style="color:var(--ink)">${rp.days.length}</b> dias úteis (capacidade ${Math.round(rp.capacity/60)}h). ${rp.overflow.length?`<b style="color:var(--ember)">${rp.overflow.length} tarefas</b> não cabem no cenário provável.`:''} A sobrecarga não é ocultada — veja os três cenários.</p></div>`;

  html+=`<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">${rp.scenarios.map(scn).join('')}</div>`;

  html+=`<div class="card"><div class="eyebrow">Fila priorizada (${rp.q.length} tarefas · ordem de execução)</div><div style="margin-top:12px;max-height:520px;overflow:auto">`;
  const tiers=Object.keys(tierGroups).map(Number).sort((a,b)=>a-b);
  for(const t of tiers){const g=tierGroups[t];
    html+=`<div class="row" style="margin:14px 0 8px"><span class="tag ${t<=2?'max':t<=4?'alta':t<=6?'media':'baixa'}" style="letter-spacing:0">${TIER_LABEL[t]||'Tier '+t}</span><span class="faint mono" style="margin-left:auto">${g.length} · ${Math.round(g.reduce((a,b)=>a+b.min,0)/60)}h</span></div>`;
    html+=g.slice(0,25).map(it=>`<div class="rev" style="margin-bottom:6px;padding:8px 12px"><span class="rtype mono" style="font-size:11px">${it.kind==='review'?'REV':it.bloco}</span><div style="flex:1"><b style="font-weight:500">${esc(it.label)}</b> <span class="faint mono">${it.min}min · ${fmtShort(it.date)}</span></div></div>`).join('');
    if(g.length>25)html+=`<div class="faint" style="font-size:11px;margin-bottom:6px">+${g.length-25} tarefas…</div>`;
  }
  if(rp.overflow.length)html+=`<div class="row" style="margin:14px 0 8px"><span class="tag fora">Sem encaixe até a prova</span><span class="faint mono" style="margin-left:auto">${rp.overflow.length}</span></div>`+
    rp.overflow.slice(0,20).map(it=>`<div class="rev venc" style="margin-bottom:6px;padding:8px 12px"><span class="rtype mono" style="color:var(--ember);font-size:11px">${it.bloco}</span><div style="flex:1"><b style="font-weight:500">${esc(it.label)}</b> <span class="faint mono">${it.min}min</span></div></div>`).join('');
  html+=`</div></div>`;
  return html;
}

/* ---------- CAÇA-QUESTÕES ---------- */
let cacaDisc = '', cacaItem = '';
let cacaSelectedTerms = new Set();
let cacaFilterAOCP = true, cacaFilterQuestoes = true, cacaFilterGabarito = false;

function cleanDicaTitleToConcept(title) {
  let t = title.replace(/\([^\)]+\)/g, '').trim();
  if (t.includes('—')) {
    const parts = t.split('—');
    const head = parts[0].trim();
    if (head.length >= 3 && head.length <= 42) t = head;
  }
  if (t.includes(':')) {
    const parts = t.split(':');
    const head = parts[0].trim();
    if (head.length >= 4 && head.length <= 40) t = head;
  }
  t = t.replace(/\s+(I|II|III|IV|V|PARTE\s+II|\d+)$/i, '').trim();
  return t.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase())
    .replace(/\s(De|Da|Do|E|Em|A|O)\s/g, m => m.toLowerCase());
}

function extractLawsAndSiglas(text) {
  const laws = [];
  const lawMatch = text.match(/Lei\s*(?:Federal|nº|º)?\s*[\d\.\/]+/gi);
  if (lawMatch) lawMatch.forEach(l => laws.push(l.replace(/Federal|nº|º/gi, '').replace(/\s+/g, ' ').trim()));
  const siglaList = ['CTB', 'CNH', 'ECA', 'CDC', 'CF', 'CP', 'CPP', 'DRE', 'DRA', 'MP', 'JECRIM'];
  siglaList.forEach(s => {
    const reg = new RegExp('\\b' + s + '\\b', 'i');
    if (reg.test(text)) laws.push(s);
  });
  return [...new Set(laws)];
}

function viewCacaQuestoes() {
  const discs = [...new Set(DS.cobertura.map(c => c.disc))].sort();
  if (!cacaDisc && discs.length) cacaDisc = discs[0];
  const items = DS.cobertura.filter(c => c.disc === cacaDisc);
  
  let matchingDicas = DS.dicas.filter(d => d.disc === cacaDisc);
  if (cacaItem) {
    matchingDicas = matchingDicas.filter(d => d.it === cacaItem);
  }
  
  const rawConcepts = []; const rawLaws = [];
  matchingDicas.forEach(d => {
    const concept = cleanDicaTitleToConcept(d.t);
    if (concept) rawConcepts.push(concept);
    const laws = extractLawsAndSiglas(d.t);
    rawLaws.push(...laws);
  });
  
  const concepts = [...new Set(rawConcepts)];
  const laws = [...new Set(rawLaws)];

  const termList = Array.from(cacaSelectedTerms);
  let searchQuery = '';
  if (cacaFilterAOCP) searchQuery += 'AOCP ';
  searchQuery += termList.join(' ');
  if (cacaFilterQuestoes) searchQuery += ' questões';
  if (cacaFilterGabarito) searchQuery += ' gabarito comentado';
  searchQuery = searchQuery.trim();

  let html = `<div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:10px">
    <select data-cacadisc>${discs.map(d=>`<option ${d===cacaDisc?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <select data-cacaitem><option value="">Toda a Disciplina (${matchingDicas.length} dicas)</option>${items.map(i=>`<option value="${esc(i.it)}" ${i.it===cacaItem?'selected':''}>Item ${esc(i.it)}: ${esc(i.cont?i.cont.substring(0,35)+'...':i.disc)}</option>`).join('')}</select>
    <div class="spacer"></div>
    <span class="muted mono">${concepts.length} conceitos · ${laws.length} leis</span>
  </div></div>`;

  html += `<div class="card" style="margin-bottom:16px">
    <div class="eyebrow" style="margin-bottom:10px">Conceitos &amp; Leis Extraídos do Edital (Clique nos chips para ativar na busca)</div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      ${laws.map(l => `<button class="btn sm ${cacaSelectedTerms.has(l)?'sun':'ghost'}" data-act="toggle-caca-term" data-term="${esc(l)}">§ ${esc(l)}</button>`).join('')}
      ${concepts.map(c => `<button class="btn sm ${cacaSelectedTerms.has(c)?'primary':'ghost'}" data-act="toggle-caca-term" data-term="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
  </div>`;

  html += `<div class="card">
    <div class="eyebrow" style="margin-bottom:10px">String de Busca Montada</div>
    <div style="background:var(--night);padding:12px;border-radius:var(--r-sm);font-family:'JetBrains Mono',monospace;color:var(--cyan);margin-bottom:14px;word-break:break-all">
      ${searchQuery ? esc(searchQuery) : '<span class="faint">Selecione conceitos acima para montar a busca…</span>'}
    </div>
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <button class="btn sm sun" data-act="copy-caca" ${!searchQuery?'disabled':''}>📋 Copiar Termos</button>
      <a class="btn sm ghost" href="https://www.google.com/search?q=${encodeURIComponent(searchQuery)}" target="_blank" ${!searchQuery?'style="pointer-events:none;opacity:0.5"':''}>🔍 Buscar no Google</a>
      <a class="btn sm ghost" href="https://www.google.com/search?q=${encodeURIComponent('site:qconcursos.com ' + searchQuery)}" target="_blank" ${!searchQuery?'style="pointer-events:none;opacity:0.5"':''}>🎓 QConcursos</a>
      <a class="btn sm ghost" href="https://www.google.com/search?q=${encodeURIComponent('site:tecconcursos.com.br ' + searchQuery)}" target="_blank" ${!searchQuery?'style="pointer-events:none;opacity:0.5"':''}>💻 TEC Concursos</a>
      <a class="btn sm ghost" href="https://www.google.com/search?q=${encodeURIComponent('site:pciconcursos.com.br ' + searchQuery)}" target="_blank" ${!searchQuery?'style="pointer-events:none;opacity:0.5"':''}>📄 PCI Concursos</a>
    </div>
  </div>`;

  return html;
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-route],[data-open],[data-act],[data-close]');
  if(!el)return;
  if(el.dataset.route){go(el.dataset.route);return;}
  if(el.hasAttribute('data-close')){closeModal();return;}
  if(el.dataset.open){
    const id=el.dataset.id;
    if(el.dataset.open==='reg')modalReg(id);
    if(el.dataset.open==='revform')modalRev(id);
    if(el.dataset.open==='novoconc')modalNovoConc();
    if(el.dataset.open==='novoedital')modalNovoEditalItem();
    if(el.dataset.open==='editedital')modalNovoEditalItem(+el.dataset.idx);
    if(el.dataset.open==='novadica')modalNovaDica();
    if(el.dataset.open==='editdica')modalNovaDica(el.dataset.code);
    if(el.dataset.open==='simulado-import')modalImportarSimulado();
    if(el.dataset.open==='ia-questoes')modalIAQuestoes(el.dataset.code);
    return;
  }
  const act=el.dataset.act;
  if(act==='start-pomo'){
    startPomodoro(el.dataset.id, +el.dataset.min||25);
  }
  if(act==='copy-briefing'){
    copyDailyBriefing();
  }
  if(act==='export-csv'){
    exportWeeklyCSV();
  }
  if(act==='export-ics'){
    exportICS();
  }
  if(act==='req-notif'){
    requestBrowserNotifications();
  }
  if(act==='save-ant-key'){
    setAnthropicKey($('#antKey').value);
    toast('Chave Anthropic API salva com sucesso!');render();
  }
  if(act==='gen-ia-questoes'){
    const code = el.dataset.code;
    const resEl = $('#iaQuestoesRes');
    resEl.innerHTML = '<span class="faint">🤖 Gerando questões inéditas com Claude IA...</span>';
    const d = DICAMAP[code] || {t:code, disc:''};
    const prompt = `Você é um elaborador de questões para concursos públicos da banca AOCP. Crie 3 questões inéditas de múltipla escolha (A, B, C, D, E) sobre a seguinte dica do edital: "${d.c}: ${d.t}" na disciplina "${d.disc}". Forneça o gabarito comentado no final.`;
    const resp = await callClaudeAPI(prompt);
    if(resp){
      resEl.innerHTML = `<div style="white-space:pre-wrap;font-size:12.5px;max-height:400px;overflow:auto" class="mono">${esc(resp)}</div>`;
    }else{
      resEl.innerHTML = '<span style="color:var(--ember)">Erro ao gerar questões. Verifique sua chave de API nos Ajustes.</span>';
    }
  }
  if(act==='toggle-caca-term'){
    const term = el.dataset.term;
    if(cacaSelectedTerms.has(term)) cacaSelectedTerms.delete(term);
    else cacaSelectedTerms.add(term);
    render();
  }
  if(act==='copy-caca'){
    const termList = Array.from(cacaSelectedTerms);
    let q = '';
    if (cacaFilterAOCP) q += 'AOCP ';
    q += termList.join(' ');
    if (cacaFilterQuestoes) q += ' questões';
    if (cacaFilterGabarito) q += ' gabarito comentado';
    navigator.clipboard.writeText(q.trim()).then(() => toast('String de busca copiada! 📋'));
  }
  if(act==='process-simulado'){
    const raw = $('#simGabaritoTxt').value.trim();
    if(!raw){alert('Cole o gabarito para processar.');return;}
    const lines = raw.split('\n');
    let acertos = 0; let total = 0;
    lines.forEach(l => {
      const parts = l.split(/[-,\s]+/);
      if(parts.length >= 2){
        total++;
        if(parts[0].trim().toUpperCase() === parts[1].trim().toUpperCase()){
          acertos++;
        }
      }
    });
    closeModal();
    toast(`Simulado processado: ${acertos}/${total} acertos (${total?Math.round(100*acertos/total):0}%)!`);
    render();
  }
  if(act==='save-sb-cfg'){
    const url=$('#sbUrl').value;const key=$('#sbKey').value;
    setSupabaseConfig(url,key);
    toast('Credenciais do Supabase salvas');render();
  }
  if(act==='sync-sb'){
    syncToSupabase();
  }
  if(act==='save-edital-item'){
    const idx=el.dataset.idx;const isEdit=idx!=='';
    const newItem={
      disc:$('#edDisc').value.trim(),
      it:$('#edItem').value.trim(),
      cont:$('#edCont').value.trim(),
      prio:$('#edPrio').value,
      sit:$('#edSit').value.trim()||'Coberto diretamente',
      lac:$('#edLac').value.trim()||'—',
      dir:1,parc:0,comp:0,corr:0
    };
    if(!newItem.disc||!newItem.it){alert('Preencha a disciplina e o item.');return;}
    if(isEdit){DS.cobertura[+idx]=Object.assign(DS.cobertura[+idx],newItem);}
    else{DS.cobertura.push(newItem);}
    await store.set('pcba:data:'+ACTIVE,DS);closeModal();toast(isEdit?'Item do edital atualizado':'Item adicionado ao edital');render();
  }
  if(act==='del-edital-item'){
    const idx=+el.dataset.idx;
    if(confirm('Excluir este item do edital?')){
      DS.cobertura.splice(idx,1);
      await store.set('pcba:data:'+ACTIVE,DS);closeModal();toast('Item excluído');render();
    }
  }
  if(act==='save-dica'){
    const code=el.dataset.code;const isEdit=code!=='';
    const cVal=isEdit?code:$('#dcC').value.trim();
    if(!cVal||!$('#dcT').value.trim()){alert('Preencha o código e o título da dica.');return;}
    const newDica={
      c:cVal,cad:$('#dcCad').value.trim(),t:$('#dcT').value.trim(),
      disc:$('#dcDisc').value.trim(),it:$('#dcIt').value.trim(),
      pg:$('#dcPg').value.trim(),prio:'MÉDIA',ad:$('#dcAd').value
    };
    if(isEdit){
      const i=DS.dicas.findIndex(d=>d.c===code);
      if(i>=0)DS.dicas[i]=Object.assign(DS.dicas[i],newDica);
    }else{
      DS.dicas.push(newDica);
    }
    buildDicaMap();await store.set('pcba:data:'+ACTIVE,DS);closeModal();toast(isEdit?'Dica atualizada':'Dica criada');render();
  }
  if(act==='del-dica'){
    const code=el.dataset.code;
    if(confirm('Excluir a dica '+code+'?')){
      DS.dicas=DS.dicas.filter(d=>d.c!==code);
      delete S.dicas[code];
      buildDicaMap();await store.set('pcba:data:'+ACTIVE,DS);save();closeModal();toast('Dica excluída');render();
    }
  }
  if(act==='reprog-run'){reprogram(TODAY(),true);toast('Reprogramação aplicada');render();}
  if(act==='save-reg'){
    const id=el.dataset.id;const u=tu(id);
    const st=$('#rgStatus').value;u.status=st;
    u.questoes=+$('#rgQ').value||0;u.acertos=+$('#rgA').value||0;u.dom=+$('#rgDom').value||0;
    u.horas=parseFloat($('#rgH').value)||0;u.obs=$('#rgObs').value;u.dataReal=st==='Concluído'?TODAY():u.dataReal;
    if(st==='Concluído'){ensureReviews(id,TODAY());
      blockDicas(tget(id)).forEach(c=>{S.dicas[c]=S.dicas[c]||{};if(!S.dicas[c].status||S.dicas[c].status==='Não iniciado')S.dicas[c].status='Concluído';if(u.dom)S.dicas[c].dom=u.dom;});}
    else removeReviews(id);
    save();reprogram(TODAY(),true);closeModal();toast('Estudo registrado');render();
  }
  if(act==='save-rev'){
    const id=el.dataset.id;const r=S.reviews[id];
    r.status=$('#rvStatus').value;r.real=$('#rvData').value;r.dur=+$('#rvDur').value||r.dur;
    r.questoes=+$('#rvQ').value||0;r.acertos=+$('#rvA').value||0;
    r.domAntes=+$('#rvDA').value||null;r.domDepois=+$('#rvDD').value||null;r.obs=$('#rvObs').value;
    save();reprogram(TODAY(),true);closeModal();toast('Revisão registrada');render();
  }
  if(act==='add-bloq'){const d=$('#bloqData').value;if(!d)return;S.config.bloqueios.push({data:d,motivo:$('#bloqMotivo').value});save();reprogram(TODAY(),true);toast('Bloqueio adicionado');render();}
  if(act==='del-bloq'){S.config.bloqueios.splice(+el.dataset.i,1);save();reprogram(TODAY(),true);render();}
  if(act==='reset'){if(confirm('Zerar todo o progresso deste concurso? Esta ação não pode ser desfeita.')){S.tasks={};S.dicas={};S.reviews={};delete S.meta.lastReprogram;save();toast('Progresso zerado');render();}}
  if(act==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aprova-pcba-'+ACTIVE+'.json';a.click();toast('Progresso exportado');}
  if(act==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const f=inp.files[0];const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.config){S=d;save();toast('Progresso importado');render();}}catch(err){alert('Arquivo inválido');}};rd.readAsText(f);};inp.click();}
  if(act==='save-conc'){
    const nome=$('#ncNome').value.trim();if(!nome){alert('Informe um nome');return;}
    let ds=emptyDataset();const raw=$('#ncData').value.trim();
    if(raw){try{ds=Object.assign(emptyDataset(),JSON.parse(raw));}catch(err){alert('Dataset JSON inválido');return;}}
    const id='C-'+uuid();CONCURSOS.push({id,nome,data:ds});
    await store.set('pcba:data:'+id,ds);await saveConcursos();
    ACTIVE=id;await saveConcursos();await loadState();closeModal();toast('Concurso criado');go('ajustes');
  }
});

    const k=el.dataset.cfg;const val=el.value;

    save();reprogram(TODAY(),true);render();
  }
});
